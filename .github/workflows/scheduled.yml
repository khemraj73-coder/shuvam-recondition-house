name: Scheduled Maintenance

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

jobs:
  security-scan:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Run tests
        run: python shuvam_glass_pro.py --test
      - name: Compile check
        run: python -m py_compile shuvam_glass_pro.py
